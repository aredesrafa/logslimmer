name: Auto Merge PRs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Merge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Switch to main and update
          git checkout main
          git pull origin main

          # Merge the PR branch (incoming) into main
          # Using --strategy-option theirs (-X theirs) ensures that in case of conflict,
          # the incoming changes (from the PR) are chosen over the current main changes.
          git merge origin/${{ github.event.pull_request.head.ref }} --strategy-option theirs -m "Auto-merge PR #${{ github.event.number }} (strategy: theirs)"

          # Push the changes to main
          git push origin main
